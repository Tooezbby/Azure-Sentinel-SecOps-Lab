<text x="340" y="194" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">rg-secops-lab-ana</text>

<line x1="340" y1="210" x2="340" y2="234" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="200" y="234" width="280" height="60" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="258" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Sentinel · Logs (KQL)</text>
<text x="340" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">SigninLogs · AuditLogs · AzureActivity</text>
