<text x="505" y="55" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Activity Log</text>
<text x="505" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">Qué cambios se hacen</text>

<text x="340" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Diagnostic settings (no el conector nativo)</text>

<line x1="175" y1="100" x2="175" y2="128" stroke="#5F5E5A" stroke-width="0.5"/>
<line x1="175" y1="128" x2="340" y2="128" stroke="#5F5E5A" stroke-width="0.5"/>
<line x1="505" y1="100" x2="505" y2="128" stroke="#5F5E5A" stroke-width="0.5"/>
<line x1="505" y1="128" x2="340" y2="128" stroke="#5F5E5A" stroke-width="0.5"/>
<line x1="340" y1="128" x2="340" y2="150" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="180" y="150" width="320" height="60" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
