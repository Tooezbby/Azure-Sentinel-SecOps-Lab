<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Arquitectura de la Fase 2</title>
<desc>Azure AD y Activity Log enviando datos vía Diagnostic settings al Log Analytics workspace, consultables desde Sentinel</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="40" y="30" width="270" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="175" y="55" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Azure AD (Entra ID)</text>
<text x="175" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Quién entra al sistema</text>

